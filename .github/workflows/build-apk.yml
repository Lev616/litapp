name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # node-sass 4 only builds on old Node versions
      - uses: actions/setup-node@v4
        with:
          node-version: '12'

      # sdkmanager needs JDK 17+, so install the SDK packages first under 17
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: '' # default 'tools' package no longer exists; we install what we need below

      - name: Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-27" "build-tools;27.0.3"

      # cordova-android 7.1.4 needs Java 8 and an old Gradle for the real build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.10.3'

      - name: Pin cordova-plugin-device
        # ^2.0.2 resolves to 2.1.0, which cordova CLI 8 cannot install (cordova-electron engine).
        # Must run BEFORE npm install so node_modules matches package.json.
        run: |
          sed -i 's#"cordova-plugin-device" spec="^2.0.2"#"cordova-plugin-device" spec="2.0.3"#' config.xml
          sed -i 's#"cordova-plugin-device": "^2.0.2"#"cordova-plugin-device": "2.0.3"#' package.json

      - name: Install tools and deps
        # package-lock.json is out of sync, so use install instead of ci
        run: |
          npm install -g ionic@3.9.2 cordova@8.1.2
          npm install --legacy-peer-deps
          npm rebuild node-sass
          node setup.js

      - name: Add Android platform
        run: ionic cordova platform add android --no-interactive

      - name: Patch CordovaLib (JCenter/Bintray are gone)
        # cordova-android 7.1.4 needs the bintray + dcendents publishing plugins, which can no
        # longer be downloaded. They are only used for publishing, so strip them out.
        run: |
          python3 - <<'PY'
          import re
          p = 'platforms/android/CordovaLib/build.gradle'
          s = open(p).read()
          s = re.sub(r"^\s*classpath 'com\.github\.dcendents:[^']*'\n", "", s, flags=re.M)
          s = re.sub(r"^\s*classpath 'com\.jfrog\.bintray\.gradle:[^']*'\n", "", s, flags=re.M)
          s = re.sub(r"^apply plugin: 'com\.github\.dcendents\.android-maven'\n", "", s, flags=re.M)
          s = re.sub(r"^apply plugin: 'com\.jfrog\.bintray'\n", "", s, flags=re.M)
          def drop(text, header):
              m = re.search(r"^" + re.escape(header) + r"\s*\{", text, flags=re.M)
              if not m:
                  return text
              i, depth = m.end(), 1
              while depth and i < len(text):
                  depth += {'{': 1, '}': -1}.get(text[i], 0)
                  i += 1
              return text[:m.start()] + text[i:]
          s = drop(s, 'install')
          s = drop(s, 'bintray')
          open(p, 'w').write(s)
          PY
          grep -c "bintray" platforms/android/CordovaLib/build.gradle || true

      - name: Build
        run: ionic cordova build android --debug --no-interactive -- -- --minSdkVersion=19

      - uses: actions/upload-artifact@v4
        with:
          name: litapp-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/*.apk
